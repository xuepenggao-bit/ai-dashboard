name: Refresh Style and Rotation Curves

on:
  push:
    branches: [main]
    paths:
      - 'assets/intraday-indices.js'
      - '.github/scripts/refresh_intraday_indices.cjs'
      - '.github/workflows/refresh-intraday-indices.yml'
      - 'tests/test_intraday_indices.cjs'
  schedule:
    # Beijing 09:35–15:50. Browsers fetch live; this is a last-good fallback.
    - cron: '35,50 1 * * 1-5'
    - cron: '5,20,35,50 2-7 * * 1-5'
  workflow_dispatch:

concurrency:
  group: refresh-intraday-indices
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_intraday_indices.cjs
      - run: node .github/scripts/refresh_intraday_indices.cjs
      - name: Persist verified curves
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/intraday_indices.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: refresh style and rotation curves $(date -u '+%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
