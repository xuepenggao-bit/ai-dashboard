name: Refresh Market Risk

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/refresh_market_risk.py'
      - '.github/workflows/refresh-market-risk.yml'
      - 'tests/test_refresh_market_risk.py'
  schedule:
    # Beijing 08:20, 17:50, 21:20; browser computes visible intraday updates.
    - cron: '20 0,13 * * 1-5'
    - cron: '50 9 * * 1-5'
  workflow_dispatch:

concurrency:
  group: refresh-market-risk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test realized volatility and rolling-high drawdown
        run: python -m unittest discover -s tests -p test_refresh_market_risk.py -v
      - name: Refresh verified index history
        run: python .github/scripts/refresh_market_risk.py
      - name: Persist verified risk snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/market_risk.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: refresh market risk $(date -u '+%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
