name: Refresh A-share Market Breadth

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/refresh_market_breadth.py'
      - '.github/workflows/refresh-market-breadth.yml'
      - 'tests/test_refresh_market_breadth.py'
  schedule:
    # Beijing time 15:05 and 15:35. The first run refreshes just after the
    # A-share close; the second catches occasional source-publication delays.
    - cron: '5,35 7 * * 1-5'
  workflow_dispatch:

concurrency:
  group: refresh-market-breadth
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh 60-session breadth history
        run: python .github/scripts/refresh_market_breadth.py

      - name: Commit and push data file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market_breadth_history.json
          git diff --staged --quiet && echo "No changes." && exit 0
          git commit -m "chore: refresh A-share breadth $(date -u '+%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "Push raced with another data workflow; retrying (${attempt}/5)…"
            sleep $((attempt * 2))
          done
          echo "Failed to publish market breadth after 5 attempts."
          exit 1
