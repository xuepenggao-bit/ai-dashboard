name: Refresh A-share 52-week High Low and MA Breadth

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/refresh_high_low_52w.py'
      - '.github/workflows/refresh-high-low-52w.yml'
      - 'tests/test_refresh_high_low_52w.py'
      - 'tests/test_refresh_ma_breadth.py'
      - 'tests/test_refresh_high_low_recovery.py'
      - 'tests/test_refresh_high_low_universe.py'
  schedule:
    # Beijing 07:15 / 08:15 repair yesterday's baseline before the open.
    - cron: '15 23 * * 0-4'
    - cron: '15 0 * * 1-5'
    # Off-peak repair retries; completed sessions are checked before expensive work.
    - cron: '43 23 * * 0-4'
    - cron: '43 0,1,2 * * 1-5'
    # Beijing 15:15 / 16:15, then 20:15 when daily constituent publication settles.
    - cron: '15 7,8,12 * * 1-5'
  workflow_dispatch:

concurrency:
  group: refresh-high-low-52w
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test exact window and complete-universe rules
        run: python -m unittest discover -s tests -p test_refresh_high_low_52w.py -v
      - name: Test moving-average windows and completed-close baselines
        run: python -m unittest discover -s tests -p test_refresh_ma_breadth.py -v
      - name: Test daily-source fallback and bounded recovery
        run: python -m unittest discover -s tests -p test_refresh_high_low_recovery.py -v
      - name: Test staged constituent publication and cache repair
        run: python -m unittest discover -s tests -p test_refresh_high_low_universe.py -v
      - name: Restore completed-session symbol histories and dated rosters
        id: history-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/high-low-52w-cache
          key: high-low-session-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: high-low-session-v2-
      - name: Calculate complete 60-session history
        id: collect
        continue-on-error: true
        run: python .github/scripts/refresh_high_low_52w.py --workers 6 --max-seconds 900
      - name: Resume only missing symbol histories after an interrupted collection
        if: steps.collect.outcome == 'failure'
        run: python .github/scripts/refresh_high_low_52w.py --workers 6 --max-seconds 900
      - name: Keep successful whole-symbol histories even if collection failed
        if: always() && steps.history-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/high-low-52w-cache
          key: high-low-session-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Persist verified history and next-session comparison prices
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/market_high_low_52w.json data/market_high_low_52w_baseline.json data/market_ma_breadth.json data/market_ma_breadth_baseline.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: refresh 52-week and moving-average market breadth $(date -u '+%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1


