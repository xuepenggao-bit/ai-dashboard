name: Refresh KOL Tweet Summaries

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/refresh_kol_tweets.py'
      - '.github/workflows/refresh-kol.yml'
      - 'data/twitter_following.json'
      - 'tests/test_refresh_kol_tweets.py'
  schedule:
    - cron: '30 0 * * *'   # 每天北京时间 08:30
  workflow_dispatch:
    inputs:
      reason:
        description: '手动触发原因'
        required: false
        default: 'Manual KOL refresh'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    permissions:
      contents: write
      models: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # twikit-x-mcp vendors the July 2026 transaction parser fix.  The
        # upstream PyPI twikit 2.3.3 still fails on X's current ondemand bundle.
        run: pip install requests twikit-x-mcp==0.1.1

      - name: Run KOL refresh script
        env:
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          TWITTER_AUTH_TOKEN:  ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0:         ${{ secrets.TWITTER_CT0 }}
        run: python .github/scripts/refresh_kol_tweets.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/twitter_kol_summary.json
          git diff --staged --quiet && echo "No changes." && exit 0
          git commit -m "chore: refresh KOL summary $(date -u '+%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "Push raced with another data workflow; retrying (${attempt}/5)…"
            sleep $((attempt * 2))
          done
          echo "Failed to publish KOL summary after 5 attempts."
          exit 1
