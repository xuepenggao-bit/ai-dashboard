name: Route Requested Market Data Backfill

on:
  push:
    branches: [main]
    paths:
      - 'data/market_refresh_request.json'
  workflow_dispatch:

concurrency:
  group: requested-market-backfill
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bounded allowlisted backfill routing
        run: node --test tests/test_market_backfill_router.cjs
      - name: Reuse or trigger required collectors and report their real status
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/route_market_backfill.cjs
